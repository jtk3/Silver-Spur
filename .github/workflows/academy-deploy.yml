name: Deploy Silver Spur Poker Academy
on:
  push:
    branches: [academy-development]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academy-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: academy-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Academy
        uses: actions/checkout@v4
      - name: Verify application entry point
        run: |
          test -f dist/index.html
          test -f dist/academy.js
          test -f dist/academy-worker.js
          test -f dist/math/poker-math.js
          test -f dist/math/holds.bin
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static Academy site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)"
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact is visible (attempt $attempt)."
              sleep 10
              exit 0
            fi
            echo "Artifact not visible yet (attempt $attempt); retrying in 5 seconds..."
            sleep 5
          done
          echo "::error::Pages artifact did not become visible"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
